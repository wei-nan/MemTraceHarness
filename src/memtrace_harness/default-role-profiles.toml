# The controller table is retained for low-level replay. Runtime primary-agent
# model selection comes from HARNESS_CHAT_*; skills below keep their own profiles.
[profiles.controller]
role = "Controller"
provider = "codex"
model = "gpt-5.6-luna"
reasoning_effort = "low"
permission = "read-only"
context_policy = "loop-snapshot"
max_attempts = 1
quota_bucket = "codex-account"
fallback_on = ["quota_exhausted", "rate_limit", "provider_overloaded"]
max_fallback_hops = 2
fallback_cooldown_seconds = 1800
# 2026-10-14: a Controller call takes 7-15 seconds; one that is silent for 15 minutes is hung, not slow
# (chat_c8eddfd8). Fail it early so the fallback chain can take over (a read-only timeout falls back).
timeout_seconds = 180

[[profiles.controller.fallbacks]]
provider = "claude"
model = "sonnet"
reasoning_effort = "medium"
quota_bucket = "claude-account"
[[profiles.controller.fallbacks]]
provider = "antigravity"
model = "gemini-3.8-flash-high"
reasoning_effort = "high"
quota_bucket = "antigravity-account"
[profiles.plan]
role = "Plan"
provider = "antigravity"
model = "gemini-3.8-flash-high"
reasoning_effort = "high"
permission = "read-only"
context_policy = "task-and-targeted-evidence"
max_attempts = 1
quota_bucket = "antigravity-account"
fallback_on = ["quota_exhausted", "rate_limit", "provider_overloaded"]
max_fallback_hops = 3
[[profiles.plan.fallbacks]]
provider = "antigravity"
model = "claude-sonnet-5-5-medium"
reasoning_effort = "medium"
quota_bucket = "antigravity-account"
[[profiles.plan.fallbacks]]
provider = "codex"
model = "gpt-6-sol"
reasoning_effort = "medium"
quota_bucket = "codex-account"
[[profiles.plan.fallbacks]]
provider = "claude"
model = "sonnet"
reasoning_effort = "medium"
quota_bucket = "claude-account"
[profiles.plan-escalation]
