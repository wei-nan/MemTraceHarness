[profiles.controller]
role = "Controller"
provider = "codex"
model = "gpt-5.6-luna"
reasoning_effort = "low"
permission = "read-only"
context_policy = "loop-snapshot"
max_attempts = 1
quota_bucket = "codex-account"
fallback_on = ["quota_exhausted", "rate_limit", "provider_overloaded"]
max_fallback_hops = 2
fallback_cooldown_seconds = 1800

[[profiles.controller.fallbacks]]
provider = "claude"
model = "sonnet"
reasoning_effort = "medium"
quota_bucket = "claude-account"

[[profiles.controller.fallbacks]]
provider = "antigravity"
model = "gemini-3.6-flash-high"
reasoning_effort = "high"
quota_bucket = "antigravity-account"

[profiles.planner]
role = "Planner"
provider = "claude"
model = "sonnet"
reasoning_effort = "medium"
permission = "read-only"
context_policy = "task-and-targeted-evidence"
max_attempts = 1
quota_bucket = "claude-account"

[profiles.planner-escalation]
role = "Planning Escalation"
provider = "claude"
model = "opus"
reasoning_effort = "high"
permission = "read-only"
context_policy = "task-and-targeted-evidence"
max_attempts = 1
quota_bucket = "claude-account"

[profiles.red-team]
role = "Red Team"
provider = "codex"
model = "gpt-5.6-sol"
reasoning_effort = "high"
permission = "read-only"
context_policy = "gate-evidence-only"
max_attempts = 1
quota_bucket = "codex-account"

[profiles.developer]
role = "Developer"
provider = "antigravity"
model = "gemini-3.1-pro-high"
reasoning_effort = "high"
permission = "workspace-write"
context_policy = "accepted-plan-and-repo"
max_attempts = 1
quota_bucket = "antigravity-account"
# 2026-09-29: the global 900s CLI timeout killed a Developer run that was iterating on
# and re-running a full-market backtest (248 steps); backtest work routinely needs
# well over 15 minutes. Only this role gets the longer limit.
timeout_seconds = 3600
