# .harness/models.toml — this Harness's model preferences. The status page edits it (comments you
# add here survive); changes take effect at once, no restart. Secrets do not belong here.
# One workspace is one project, so there are no per-project overrides.

[chat]                      # the quick reply to a message
provider = "antigravity"
model = "gemini-3.8-flash-medium"
fallbacks = ["codex/gpt-6-luna", "claude/haiku"]

# Nightly memory digest: use a stronger model than chat. Unset = reuse the chat model.
[digest]
provider = "claude"
model = "claude-sonnet-5-5"
fallbacks = ["codex/gpt-6.1-sol"]

# Memory archive: the nightly split of a day into matters, the weekly matter review and rebuilds
# (see "Memory archive" in docs/operating-contract.md). Unset = reuse the digest model.
[archive]
enabled = true
provider = "antigravity"
model = "claude-opus-5-5-medium"
fallbacks = ["codex/gpt-6.1-sol", "claude/opus"]

# Background topic recall (finds earlier discussion of the current topic; see
# docs/operating-contract.md). Unset = reuse the digest model.
[recall]
enabled = true
provider = "codex"
model = "gpt-5.6-sol"
fallbacks = ["antigravity/gemini-3.8-flash-high"]
# ttl_hours = 72

# Nightly audit: identify repeated misunderstandings and friction, then evaluate calibration notes.
# Disabled pauses the automatic nightly audit; `memory-audit` remains available for explicit runs.
[audit]
enabled = true
# provider = "claude"
# model = "claude-sonnet-5-5"
# fallbacks = ["codex/gpt-6"]

# [memory]
# workspace_id = "ws_..."                    # where conversation memory is written; unset = the project's own
# operator_preference_workspace_id = "ws_..."

[behavior]
unattended_write_requires_approval = true
schedule_timezone = "Asia/Taipei"           # for "daily"/"weekdays" schedule times; any IANA zone
# approval_ttl_hours = 12
# reply_language = "Traditional Chinese (繁體中文，台灣用語與正體字)"

# The Agent Loop's role profiles (Controller / Planner / Red Team / Developer) are a separate file,
# .harness/roles.toml, used automatically when it exists.
