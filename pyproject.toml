[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memtrace-harness"
version = "0.4.0"
description = "CLI-only execution and token measurement harness for MemTrace workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
memtrace-harness = "memtrace_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memtrace_harness = ["default-role-profiles.toml", "output_schemas/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
