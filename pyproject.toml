[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memtrace-harness"
version = "0.1.0"
description = "External harness for MemTrace-backed model workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
memtrace-harness = "memtrace_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
