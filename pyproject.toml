[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memtrace-harness"
version = "0.5.0"
description = "CLI-only execution and token measurement harness for MemTrace workflows, with its Telegram and web services"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
memtrace-harness = "memtrace_harness.cli:main"
memtrace-telegram = "memtrace_services.telegram.main:main"
memtrace-web = "memtrace_services.web.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memtrace_harness = ["default-role-profiles.toml", "output_schemas/*.json"]
memtrace_services = ["web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
