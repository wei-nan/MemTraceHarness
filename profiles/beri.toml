quota_bucket = "codex-account"

[profiles.developer]
role = "Developer"
provider = "antigravity"
model = "gemini-3.8-flash-high"
reasoning_effort = "high"
permission = "workspace-write"
context_policy = "accepted-plan-and-repo"
max_attempts = 1
quota_bucket = "antigravity-account"
fallback_on = ["quota_exhausted", "rate_limit", "provider_overloaded"]
max_fallback_hops = 2
fallback_cooldown_seconds = 1800

# 2026-09-05: primary model bumped from gemini-3.6-flash-medium to
# gemini-3.8-flash-high (verified against `agy models` before use, per the
# antigravity_git_diff_safety_net memory's guidance — display names differ from
# CLI identifiers, never guess). Still Antigravity/Gemini, unlike the read-only
# roles above: Developer needs workspace-write, and this was a "same provider,
# newer/higher-tier model" request, not part of the reliability-driven move off
# Antigravity applied to the read-only roles.
[[profiles.developer.fallbacks]]
provider = "antigravity"
model = "claude-sonnet-4-6"
reasoning_effort = "high"
quota_bucket = "antigravity-account"

[[profiles.developer.fallbacks]]
provider = "claude"
model = "sonnet"
