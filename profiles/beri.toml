[profiles.controller]
role = "Controller"
provider = "codex"
model = "gpt-5.6-luna"
reasoning_effort = "low"
permission = "read-only"
context_policy = "loop-snapshot"
max_attempts = 1
quota_bucket = "codex-account"
fallback_on = ["quota_exhausted", "rate_limit", "provider_overloaded"]
max_fallback_hops = 2
fallback_cooldown_seconds = 1800

# Reordered for Beri, same as MemTrace's profile: prefer Gemini over Sonnet when
# Codex Luna (the primary) is unavailable.
[[profiles.controller.fallbacks]]
provider = "antigravity"
model = "gemini-3.6-flash-high"
reasoning_effort = "high"
quota_bucket = "antigravity-account"

[[profiles.controller.fallbacks]]
provider = "claude"
model = "sonnet"
reasoning_effort = "medium"
quota_bucket = "claude-account"

[profiles.planner]
role = "Planner"
provider = "antigravity"
model = "gemini-3.6-flash-high"
reasoning_effort = "high"
permission = "read-only"
context_policy = "task-and-targeted-evidence"
max_attempts = 1
quota_bucket = "antigravity-account"

[profiles.planner-escalation]
role = "Planning Escalation"
provider = "claude"
model = "opus"
reasoning_effort = "high"
permission = "read-only"
context_policy = "task-and-targeted-evidence"
max_attempts = 1
quota_bucket = "claude-account"

# Red Team: Claude via Antigravity (not the direct `claude` CLI — an independent auth
# path, and a different vendor from Developer's Gemini). Fallback chain now allowed
# (role_profiles._validate_role_boundaries no longer hard-blocks it): if the primary
# model is unavailable, the completion summary will show it fell back, so this is a
# visible degrade, not a silent one.
[profiles.red-team]
role = "Red Team"
provider = "antigravity"
model = "claude-sonnet-4-6"
reasoning_effort = "high"
permission = "read-only"
context_policy = "gate-evidence-only"
max_attempts = 1
quota_bucket = "antigravity-account"
fallback_on = ["quota_exhausted", "rate_limit", "provider_overloaded"]
max_fallback_hops = 1

[[profiles.red-team.fallbacks]]
provider = "antigravity"
model = "gemini-3.6-flash-high"
reasoning_effort = "high"
quota_bucket = "antigravity-account"

[profiles.developer]
role = "Developer"
provider = "antigravity"
model = "gemini-3.1-pro-high"
reasoning_effort = "high"
permission = "workspace-write"
context_policy = "accepted-plan-and-repo"
max_attempts = 1
quota_bucket = "antigravity-account"
